<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/health-cards/" />
  <title>Health Cards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f3f4f6);
      color: var(--hub-text, #000000);
      min-height: 100vh;
    }

    .container { max-width: 680px; margin: 0 auto; padding: 24px 16px; }

    /* Page header */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--hub-text-muted, #6b7280); font-size: 0.875rem; }

    /* Member list */
    .member-list { display: flex; flex-direction: column; gap: 8px; }
    .member-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 12px);
      padding: 14px 16px;
      cursor: pointer; width: 100%; text-align: left;
      transition: border-color 0.15s;
    }
    .member-card:hover { border-color: var(--hub-primary, #4f46e5); }
    .member-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    }
    .member-avatar-lg {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 1.3rem; flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-weight: 600; }
    .member-role { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); text-transform: capitalize; }
    .allergy-badge {
      padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; flex-shrink: 0;
    }
    .badge-urgent  { background: var(--hub-bg, #fef2f2); color: #dc2626; }
    .badge-normal  { background: #fef9c3; color: #92400e; }
    .badge-none    { background: var(--hub-border, #e5e7eb); color: var(--hub-text-muted, #6b7280); }
    .chevron { color: var(--hub-text-muted, #9ca3af); font-size: 1.3rem; }

    /* Detail header */
    .detail-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .back-btn {
      background: none; border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: 8px; padding: 7px 14px; font-size: 0.875rem;
      cursor: pointer; color: var(--hub-text, #000000); flex-shrink: 0;
    }
    .back-btn:hover { background: var(--hub-bg, #f3f4f6); }
    .detail-member { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .detail-name { font-size: 1.2rem; font-weight: 700; }
    .detail-role { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); text-transform: capitalize; }
    .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* Sections */
    .section { margin-bottom: 24px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .section-header h2 {
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--hub-text-muted, #6b7280);
    }

    /* Entry cards */
    .entry-card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 10px);
      padding: 14px 16px; margin-bottom: 8px;
    }
    .entry-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 6px;
    }
    .entry-title { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .entry-field { font-size: 0.875rem; color: var(--hub-text-muted, #374151); margin-top: 5px; line-height: 1.5; }
    .entry-notes { font-style: italic; }
    .steps { margin-top: 2px; white-space: pre-line; }
    .dose { font-size: 0.8rem; font-weight: 400; color: var(--hub-text-muted, #6b7280); background: var(--hub-bg, #f3f4f6); padding: 2px 8px; border-radius: 4px; }

    /* Severity badges */
    .severity-badge {
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .sev-mild         { background: var(--hub-tint-success, #d1fae5); color: var(--hub-tint-success-fg, #065f46); }
    .sev-moderate     { background: var(--hub-tint-warning, #fef3c7); color: var(--hub-tint-warning-fg, #92400e); }
    .sev-severe       { background: #fed7aa; color: #9a3412; }
    .sev-anaphylactic { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #991b1b); }

    /* Contact specifics */
    .contact-priority {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; background: var(--hub-primary, #4f46e5);
      color: var(--hub-primary-fg, #fff); border-radius: 50%;
      font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
    }
    .contact-rel { font-size: 0.8rem; font-weight: 400; color: var(--hub-text-muted, #6b7280); }
    .phone-link { color: var(--hub-primary, #4f46e5); text-decoration: none; font-weight: 600; }
    .phone-link:hover { text-decoration: underline; }

    /* Buttons */
    .btn-primary {
      background: var(--hub-primary, #111827); color: var(--hub-primary-fg, #fff);
      border: none; border-radius: 8px; padding: 9px 18px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) { background: var(--hub-primary-hover, #374151); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: var(--hub-surface, #fff); color: var(--hub-text, #374151);
      border: 1px solid var(--hub-border, #d1d5db); border-radius: 8px; padding: 9px 18px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
    }
    .btn-secondary:hover { background: var(--hub-bg, #f9fafb); }
    .btn-add {
      background: none; color: var(--hub-primary, #4f46e5);
      border: 1px dashed var(--hub-primary, #4f46e5);
      border-radius: 8px; padding: 5px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-add:hover { background: var(--hub-tint-info, #eff6ff); }
    .btn-icon {
      background: none; border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: 6px; padding: 3px 10px; font-size: 0.78rem;
      cursor: pointer; color: var(--hub-text-muted, #374151);
    }
    .btn-icon:hover { background: var(--hub-bg, #f3f4f6); }
    .btn-danger { color: #dc2626; border-color: #fecaca; }
    .btn-danger:hover { background: var(--hub-bg, #fef2f2); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
    }
    .modal {
      background: var(--hub-surface, #fff); border-radius: 14px;
      padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* Form fields */
    .form-field { margin-bottom: 14px; }
    .form-field label {
      display: block; font-size: 0.85rem; font-weight: 600;
      color: var(--hub-text-muted, #374151); margin-bottom: 5px;
    }
    .required { color: #dc2626; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--hub-border, #d1d5db); border-radius: 8px;
      font-size: 0.9rem; font-family: inherit;
      background: var(--hub-bg, #f9fafb); color: var(--hub-text, #000000);
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      outline: 2px solid var(--hub-primary, #4f46e5); outline-offset: -1px;
    }
    .form-field textarea { resize: vertical; }

    /* Empty state */
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .empty-text { font-size: 0.875rem; color: var(--hub-text-muted, #9ca3af); padding: 8px 0; }
    /* Care team */
    .badge-care { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--hub-tint-info, #dbeafe); color: var(--hub-tint-info-fg, #1e40af); white-space: nowrap; }
    .care-row { display: flex; align-items: flex-start; gap: 10px; background: var(--hub-surface, #fff); border: 1px solid var(--hub-border, #e5e7eb); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.875rem; }
    .care-row input { margin-top: 3px; flex-shrink: 0; }
    .care-row .care-hint { color: var(--hub-text-muted, #6b7280); font-size: 0.8rem; margin-top: 3px; line-height: 1.45; }
    .header-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-ghost { background: none; color: var(--hub-text-muted, #374151); border: 1px solid var(--hub-border, #d1d5db); border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { background: var(--hub-bg, #f3f4f6); }
    /* Printed health card. Built by print.js into a body-level .print-root that
       is never shown on screen; print media swaps it in for the app while
       <html> has .printing. The --hub-* resets make every var() below take its
       fallback, so paper gets the same dark-on-white card in a dark theme. */
    .print-root {
      display: none;
      --hub-text: initial; --hub-text-muted: initial; --hub-bg: initial;
      --hub-tint-success: initial; --hub-tint-success-fg: initial;
      --hub-tint-warning: initial; --hub-tint-warning-fg: initial;
      --hub-tint-danger: initial; --hub-tint-danger-fg: initial;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 13px; color: var(--hub-text, #111); max-width: 700px; margin: 0 auto;
    }
    .print-root .card-title { font-size: 22px; font-weight: 800; border-bottom: 3px solid #111; padding-bottom: 10px; margin-bottom: 6px; }
    .print-root .card-meta { font-size: 11px; color: var(--hub-text-muted, #777); margin-bottom: 22px; }
    .print-root .section { margin-bottom: 20px; }
    .print-root .section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--hub-text-muted, #666); border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 10px; }
    .print-root .entry { padding: 8px 0 8px 12px; border-left: 3px solid #ddd; margin-bottom: 10px; }
    .print-root .entry-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .print-root .entry-line { font-size: 12px; color: var(--hub-text, #333); margin-top: 4px; line-height: 1.5; }
    .print-root .steps { margin-top: 2px; white-space: pre-line; }
    .print-root .note { font-style: italic; }
    .print-root .sev-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 10px; }
    .print-root .sev-mild { background: var(--hub-tint-success, #d1fae5); color: var(--hub-tint-success-fg, #065f46); }
    .print-root .sev-moderate { background: var(--hub-tint-warning, #fef3c7); color: var(--hub-tint-warning-fg, #92400e); }
    .print-root .sev-severe { background: #fed7aa; color: #9a3412; }
    .print-root .sev-anaphylactic { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #991b1b); }
    .print-root .dose-tag { font-size: 11px; font-weight: 400; color: var(--hub-text-muted, #555); background: var(--hub-bg, #f3f4f6); padding: 1px 6px; border-radius: 4px; }
    .print-root .rel-tag { font-size: 11px; font-weight: 400; color: var(--hub-text-muted, #666); }
    .print-root .contact-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .print-root .contact-num { min-width: 22px; height: 22px; background: #111; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
    .print-root .phone { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .print-root .footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid #ddd; font-size: 11px; color: #aaa; }
    @media print {
      html.printing, html.printing body { background: none !important; min-height: 0 !important; }
      html.printing body > *:not(.print-root) { display: none !important; }
      html.printing .print-root { display: block; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="container"><p class="subtitle" style="margin-top:40px">Loading…</p></div>
</div>

<script type="module">
import {
  esc, memberColor, initial, hubConfirm, hubAlert, isAdult,
  createShareHelper, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS, glyph,
} from "/hub-sdk.js";
import {
  SEV_LABEL, SEV_CLASS, isSafeId, hasSevereAllergy, allergyCountLabel,
  cardNameUpdates, profileInsert,
  VISIBILITY_ADULTS, VISIBILITY_CARE, isCareProfile, isCareTeamMember,
  canShareWithCareTeam, failureLine, entrySnapshot, restoreEntry, confirmedEntries, printReady,
} from "./logic.js";
import { createShareUi, createOverlayView } from "/hub-share-ui.js";
import { printCardMarkup, printInPlace } from "./print.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const APP_ID  = window.__APP_ID      ?? "health-cards";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const IS_ADMIN   = window.__IS_ADMIN === true;
const ADMIN_CONFIG_URL = window.__ADMIN_CONFIG_URL ?? "";
// Who may change a card. The row policies take writes from an adult alone
// (at home the adults; in a shared space every participant); a guest or a
// child reads what the hub shows them — their own card, and the care team's
// cards — and the page offers them nothing the hub would refuse. The demo
// (no database) shows the adult's page.
const IS_ADULT = !DB || isAdult(HUB_MEMBER);
// Who wrote an entry. The hub stamps the caller on every INSERT (row policy
// writer_column) and requires the column to be named, so the page binds the
// member it already knows; what is stored is the hub's answer.
const WRITER = HUB_MEMBER?.id ?? "";
// In a shared space every participant is an adult, but only the steward
// supervises: the hub stamps a participant's new card to the participant and
// narrows their changes to their own card, so the page offers a participant
// their own card alone and the steward every card. In a co-parenting space
// each parent is a steward, and the hub supervises CHILDREN only
// (coparenting_child_supervision): a parent creates a child's card, and
// changes or removes any entry on it, whichever parent wrote it. An adult's
// card — the other parent's — stays theirs: a parent is offered their own
// card and their own entries there, never the other parent's.
const IN_SPACE = (window.__TENANT_KIND ?? "household") !== "household";
const SPACE_KIND = window.__SPACE_KIND ?? null;
const SUPERVISES = !IN_SPACE || (IS_ADMIN && SPACE_KIND !== "coparenting");
const COPARENTING_STEWARD = IN_SPACE && IS_ADMIN && SPACE_KIND === "coparenting";
// Whether the viewer supervises this member's card: everyone's where SUPERVISES,
// and a child's card for a co-parenting steward (the roster's role decides,
// as the hub's current-child-member check does).
function supervisesCard(memberId) {
  return SUPERVISES
    || (COPARENTING_STEWARD && members.find(m => m.id === memberId)?.role === "child");
}
function canEditCard(memberId) {
  return IS_ADULT && (supervisesCard(memberId) || memberId === HUB_MEMBER?.id);
}
// Whether the viewer may change or remove one entry on the open card. At home
// an adult changes any entry (adults_bypass); in a space a participant's
// changes land only on the entries they wrote (writer column created_by) —
// not the steward's; an entry from before the column existed is credited to
// the card's member (migration 003) — so the page offers Edit/Remove on those
// alone. The steward changes any; a co-parenting steward any on a child's
// card (supervisesCard). Removing is for adults alone — the hub refuses a
// non-adult's DELETE (delete_adult_only) and canEditCard already leaves a
// guest or child no controls. An entry whose INSERT has not settled is not
// offered either: an Edit or Remove sent now could reach the hub before the row.
// Nor is an entry with an edit or remove in flight (entriesInFlight): one
// change at a time, so each snapshot is of the confirmed entry.
function canChangeEntry(entry) {
  return canEditCard(selectedMemberId) && !pendingInserts.has(entry?.id)
    && !entriesInFlight.has(entry?.id)
    && (supervisesCard(selectedMemberId) || (!!WRITER && entry?.created_by === WRITER));
}
// Whether this viewer is offered "Share with the care team" on a card: their
// own, and a child's (canShareWithCareTeam), on a card they may change.
function canShareCard(memberId) {
  return canEditCard(memberId) && (!DB || canShareWithCareTeam(memberId, HUB_MEMBER, members));
}

// External share links (manifest.shareable.card): a read-only page of one
// member's allergies, medications and emergency contacts, for a babysitter or
// coach. This is health information every adult here can read and edit (and
// the care team can read), so
// the manifest lets only household admins mint (`mint_roles: "admin"`, a 403
// for anyone else) and the button is hidden for everyone else to match.
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const CAN_SHARE = share.enabled && IS_ADMIN;
// In a co-parenting space the hub mints a link only to the steward's own or a
// child's card (coparenting_child_supervision), the cards whose title
// refreshCardNames can bring up to date first; the other parent's card is
// theirs to share.
function canShareLink(memberId) {
  return CAN_SHARE && (!COPARENTING_STEWARD || canEditCard(memberId));
}
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share,
  itemType: "card",
  noun: "card",
  scopeHtml: (item) => `The page shows ${esc(item.title)}’s allergies and what to do, their medications with the dose and where they’re kept, and their emergency contacts’ phone numbers. Anyone with the link can read it, so send it only to the person looking after them, and pick the shortest expiry that covers the visit. Changes you make here show up on the page straight away.`,
  esc,
  glyph,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks,
  expiryChoices: SHARE_EXPIRY_CHOICES,
  defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  getMe: () => HUB_MEMBER,
  isAdmin: () => IS_ADMIN,
  memberName: (id) => members.find(m => m.id === id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

let members     = [];
let groups      = [];   // hub member groups (family.groups): who is on the care team
let settings    = { care_team_group_id: null }; // app_config settings, admin-written
// Whether the groups and the setting were read. Either one unread, the page
// does not know who the care team is: it says nothing about it (labels only —
// the cards listed are the hub's answer either way).
let groupsRead   = !CONTEXT;
let settingsRead = !DB;
let profiles    = {};   // member_id  → profile row | null
let allergies   = {};   // profile_id → allergy[]
let medications = {};   // profile_id → medication[]
let contacts    = {};   // profile_id → contact[]

let selectedMemberId = null;
let modalEl = null;
// Set when the hub refuses the reads outright (see loadAllProfileData).
let accessDenied = false;
// Set when the first read of the cards failed for any other reason.
let loadFailed = false;
// Set once the hub has answered the first read of every card.
let profilesLoaded = false;
// Set once the first read of the care-team setting has settled (either way).
let careTeamChecked = !DB;
// A care-team switch write still in flight: the switch waits for it.
let careWriteInFlight = false;
// Entries added on the page whose INSERT has not settled yet.
const pendingInserts = new Set();
// Writes (adds, edits, removes) sent through persist and not settled yet, by
// the profile id of the card they change. The card is not printed meanwhile.
const writesInFlight = new Map();
// Entries, by row id, with a change through persist not settled yet: held from
// the snapshot (before the optimistic change) until the write settles.
const entriesInFlight = new Set();
// Of those, the ones whose write failed: their recovery re-read shows what is
// stored, so a re-read does not keep them as the page has them.
const entriesFailed = new Set();
// Entries whose write (INSERT, edit or remove) landed: `at`, the readSeq
// current then, and `row`, the saved row (null once removed). A re-read that
// started at or before `at` (and so may not see the write) keeps the saved
// row, or keeps the entry absent. A failed write is never recorded.
const landedAt = new Map();
let readSeq = 0;
// The reads not answered yet, by seq. Once none that began at or before a
// landed write's `at` is out, every later read sees the write: forgotten.
const openReads = new Set();
function readDone(seq) {
  openReads.delete(seq);
  const oldest = Math.min(...openReads);
  for (const [id, { at }] of landedAt) if (oldest > at) landedAt.delete(id);
}

// ── DB helper ────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) {
    throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status });
  }
  return json;
}

// Several statements in one request: `{ statements }` → `{ results }`, one
// per statement, in order. Reads are answered from manifest.preload when every
// statement is preloaded; writes run as one atomic transaction.
// The most statements the hub takes in one batch (MAX_APP_DB_BATCH_STATEMENTS).
const BATCH_LIMIT = 25;
async function dbBatch(statements) {
  if (!DB) return statements.map(() => ({ rows: [] }));
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements: statements.map(({ sql, params = [] }) => ({ sql, params })) }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error || !Array.isArray(json.results)) {
    throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status });
  }
  return json.results;
}

// A write the hub narrowed to nothing still answers 200 with `changed: 0`.
// (The demo has no database and writes nothing.)
function wroteNothing(res) {
  return !!DB && Number(res?.changed ?? 0) === 0;
}
function entryOnPage(id) {
  return !!id && [allergies, medications, contacts].some(byProfile =>
    Object.values(byProfile).some(list => (list ?? []).some(r => r.id === id)));
}

// Sends a write whose result is already on the card. If the hub refuses it, or
// it changed nothing, the cards are read again so the page shows what is
// stored, and the member is told the change did not save. `rowId` names the
// entry an UPDATE or DELETE targets: still there after the re-read, the hub
// narrowed the write away from this member; gone, someone removed it.
//
// `insert` ({ table, kind, row }) marks an INSERT of the optimistic `row`
// (kept on the card while it is in pendingInserts). An unknown outcome — no
// status, a 400, a 5xx other than 507 — may have landed with its answer lost:
// the row is read back by its id, and found, the INSERT succeeded.
//
// `before` (snapshotEntry) is the entry's last confirmed state, taken before
// the optimistic change. When the write fails and the re-read fails too, the
// entry goes back to it: a refused change must not stay on the card as if
// saved (and print with it). A re-read that succeeds shows what is stored.
async function persist(write, rowId = null, insert = null, before = null) {
  const card = before?.pid ?? insert?.row.profile_id ?? null;
  writesInFlight.set(card, (writesInFlight.get(card) ?? 0) + 1);
  try {
    await settleWrite(write, rowId, insert, before);
  } finally {
    const left = (writesInFlight.get(card) ?? 1) - 1;
    if (left > 0) writesInFlight.set(card, left);
    else writesInFlight.delete(card);
    entriesInFlight.delete(before?.id ?? rowId);
    entriesFailed.delete(before?.id ?? rowId);
    render();
  }
}
// persist's body: what the hub answered decides what the card shows.
async function settleWrite(write, rowId, insert, before) {
  let res;
  try {
    res = await write;
  } catch (e) {
    console.error(e);
    if (insert && outcomeUnknown(e) && await rowStored(insert.table, insert.row.id)) {
      insertLanded(insert);
      return;
    }
    if (insert) pendingInserts.delete(insert.row.id);
    entriesFailed.add(before?.id ?? rowId);
    if (!await reread()) restoreConfirmed(before);
    render();
    hubAlert(failureLine(e, { action: "save that change" }));
    return;
  }
  if (!wroteNothing(res)) {
    if (insert) insertLanded(insert);
    else if (before) changeLanded(before);
    return;
  }
  if (insert) pendingInserts.delete(insert.row.id);
  console.error("write changed nothing", rowId);
  entriesFailed.add(before?.id ?? rowId);
  const readBack = await reread();
  if (!readBack) restoreConfirmed(before);
  render();
  hubAlert(!readBack || !rowId
    ? failureLine(null, { action: "save that change" })
    : entryOnPage(rowId)
      ? "You don’t have permission to change that entry."
      : "That entry has been removed.");
}

// The recovery re-read of persist: true when the hub answered it with the
// cards. A refusal (403) is caught by loadAllProfileData, which sets
// accessDenied and leaves the lists as they were — nothing was refreshed, so
// that is a failed recovery too, and the refused change is put back.
async function reread() {
  try {
    await loadAllProfileData();
  } catch (e) {
    console.error(e);
    return false;
  }
  return !accessDenied;
}
function entryLists(kind) {
  return kind === "allergies" ? allergies : kind === "medications" ? medications : contacts;
}
// An entry's last confirmed state on card `pid`, for persist's `before`.
// The entry is held (entriesInFlight) until persist settles the write.
function snapshotEntry(kind, pid, id) {
  entriesInFlight.add(id);
  return { kind, pid, ...entrySnapshot(entryLists(kind)[pid], id) };
}
function restoreConfirmed(before) {
  if (!before) return;
  const byProfile = entryLists(before.kind);
  byProfile[before.pid] = restoreEntry(byProfile[before.pid], before);
}

function outcomeUnknown(e) {
  const status = e?.status;
  return !status || status === 400 || (status >= 500 && status !== 507);
}
async function rowStored(table, id) {
  try {
    const { rows } = await db(`SELECT id FROM ${table} WHERE id = ?`, [id]);
    return (rows ?? []).some(r => r.id === id);
  } catch (e) {
    console.error(e);
    return false;
  }
}
// The success path of an INSERT: no longer pending, kept by any re-read
// already in flight, and back on its card if a re-read dropped it meanwhile.
function insertLanded({ kind, row }) {
  pendingInserts.delete(row.id);
  landedAt.set(row.id, { at: readSeq, row });
  const byProfile = entryLists(kind);
  const list = (byProfile[row.profile_id] ??= []);
  if (!list.some(r => r.id === row.id)) list.push(row);
}
// The success path of an edit or remove: the entry as the page has it (held
// there while the write was in flight) is what is stored, or it is gone.
function changeLanded({ kind, pid, id }) {
  const row = (entryLists(kind)[pid] ?? []).find(r => r.id === id) ?? null;
  landedAt.set(id, { at: readSeq, row });
}

  modalEl = document.createElement("div");

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-m1", name: "Emma", role: "child" },
      { id: "demo-m2", name: "Liam", role: "child" },
      { id: "demo-m3", name: "Sarah", role: "adult" },
    ];
    return;
  }
  const ctx = await fetchContext("family.members,family.groups");
  // A 200 can still name a key the hub failed to read. The members are the
  // page; the groups only label it, so a failed read of them is "unknown".
  if (!ctx.members) throw new Error("Couldn’t reach the hub. Try again.");
  members = ctx.members;
  // The groups decide who is on the care team — for the page's labels only:
  // the hub decides which cards a member reads, and the page lists them all.
  ({ groups, groupsRead } = ctx);
}
// One context read. `members` is unset when the hub failed to answer or named
// family.members in $errors; the groups are unread (and empty) when it failed,
// named family.groups there, or sent something that is not a list.
async function fetchContext(keys) {
  const res = await fetch(`${CONTEXT}?keys=${keys}`);
  const ctx = await res.json().catch(() => null);
  const ok = res.ok && !!ctx && typeof ctx === "object" && !ctx.error;
  const errors = ok && Array.isArray(ctx.$errors) ? ctx.$errors : [];
  const read = (key) => ok && !errors.includes(key);
  const groupsRead = read("family.groups") && Array.isArray(ctx["family.groups"]);
  return {
    members: read("family.members") ? (ctx["family.members"] ?? []) : undefined,
    groups: groupsRead ? ctx["family.groups"] : [],
    groupsRead,
  };
}

// ── Care team ────────────────────────────────────────────────────────────────
// The hub member group an admin named as the care team (app_config settings,
// readable by every member, written through the hub's admin-config endpoint
// alone). Its members read every card marked "care": the hub's row policy
// decides that (privileged_groups, select only); these helpers only keep the
// page's headings and controls on the same rule.
function readSettings(rows) {
  settings = { ...settings, care_team_group_id: null };
  for (const r of rows ?? []) if (r.key === "care_team_group_id") settings.care_team_group_id = r.value || null;
}
// Read on its own, not with the cards: a failed or refused read of the setting
// leaves the care team unknown (no labels), never the cards unread.
async function loadSettings() {
  if (!DB) return;
  try {
    const { rows } = await db("SELECT key, value FROM app_health_cards__settings WHERE key = 'care_team_group_id'");
    readSettings(rows);
    settingsRead = true;
  } catch (e) {
    settings = { ...settings, care_team_group_id: null };
    settingsRead = false;
    throw e;
  }
}
// The groups read again on their own (Try again on "Couldn’t check the care team").
async function loadGroups() {
  if (!CONTEXT) return;
  ({ groups, groupsRead } = await fetchContext("family.groups"));
  if (!groupsRead) throw new Error("care team groups unread");
}
window.retryCareTeam = async function() {
  await Promise.all([
    settingsRead ? null : loadSettings(),
    groupsRead ? null : loadGroups(),
  ]).catch(e => console.error("care team still unread", e));
  render();
};
function careTeamKnown() { return groupsRead && settingsRead; }
function careTeamGroup() {
  return groups.find(g => g.id === settings.care_team_group_id) ?? null;
}
function careTeamConfigured() { return !!careTeamGroup(); }
function onCareTeam() { return isCareTeamMember(HUB_MEMBER, groups, settings.care_team_group_id); }

async function loadProfileData(memberId) {
  if (!DB) {
    if (memberId === "demo-m2") {
      profiles[memberId] = { id: "demo-p1", member_id: memberId, notes: "" };
      const pid = "demo-p1";
      allergies[pid] = [{
        id: "demo-a1", profile_id: pid, name: "Peanuts", severity: "anaphylactic",
        triggers: "All peanut products, including oils used in cooking",
        symptoms: "Hives, lip/face swelling, difficulty breathing, vomiting",
        response_steps: "1. Administer EpiPen Jr. to outer thigh, hold 10 seconds\n2. Call 911 immediately\n3. Call parents (see contacts below)",
        sort_order: 0,
      }];
      medications[pid] = [
        { id: "demo-med1", profile_id: pid, name: "EpiPen Jr.", dose: "0.15mg", when_to_give: "Severe reaction or any difficulty breathing", location: "Red case — front pocket of backpack", notes: "Hold in place for 10 seconds. Massage injection site afterward." },
        { id: "demo-med2", profile_id: pid, name: "Benadryl", dose: "12.5mg (5mL)", when_to_give: "Mild reactions only (hives without breathing issues)", location: "Small blue pouch in backpack", notes: "Do not give if EpiPen was already used." },
      ];
      contacts[pid] = [
        { id: "demo-c1", profile_id: pid, name: "Sarah Mayer", relationship: "Mom", phone: "555-123-4567", priority: 1 },
        { id: "demo-c2", profile_id: pid, name: "Adam Mayer", relationship: "Dad", phone: "555-765-4321", priority: 2 },
        { id: "demo-c3", profile_id: pid, name: "Dr. Lisa Chen", relationship: "Pediatrician", phone: "555-999-0000", priority: 3 },
      ];
    } else {
      profiles[memberId] = null;
    }
    return;
  }

  // One request: the entries are scoped to the card by a JOIN (not
  // `profile_id IN (SELECT …)`, which the row-policy rewriter refuses), so
  // they need not wait for the card's id.
  const seq = ++readSeq;
  openReads.add(seq);
  try {
    const [profileRes, ar, mr, cr] = await dbBatch([
      { sql: "SELECT * FROM app_health_cards__health_profiles WHERE member_id = ? LIMIT 1", params: [memberId] },
      { sql: "SELECT a.* FROM app_health_cards__health_allergies a JOIN app_health_cards__health_profiles p ON p.id = a.profile_id AND p.member_id = ? ORDER BY a.sort_order, a.created_at", params: [memberId] },
      { sql: "SELECT m.* FROM app_health_cards__health_medications m JOIN app_health_cards__health_profiles p ON p.id = m.profile_id AND p.member_id = ? ORDER BY m.created_at", params: [memberId] },
      { sql: "SELECT c.* FROM app_health_cards__health_contacts c JOIN app_health_cards__health_profiles p ON p.id = c.profile_id AND p.member_id = ? ORDER BY c.priority, c.created_at", params: [memberId] },
    ]);

    const profile = (profileRes.rows ?? [])[0];
    if (!profile || !isSafeId(profile.id) || !isSafeId(profile.member_id)) {
      profiles[memberId] = null;
      return;
    }
    profiles[memberId] = profile;
    const pid = profile.id;
    const safe = (res) => (res.rows ?? []).filter(r => isSafeId(r.id) && r.profile_id === pid);

    allergies[pid]   = withPending(allergies[pid], safe(ar), seq);
    medications[pid] = withPending(medications[pid], safe(mr), seq);
    contacts[pid]    = withPending(contacts[pid], safe(cr), seq);
  } finally {
    readDone(seq);
  }
}

// A re-read rebuilds the lists from the hub, which cannot return an entry
// whose INSERT has not landed yet. `fresh` plus the entries of `before` still
// in pendingInserts that the hub did not return, so an optimistic row stays
// on the card until its INSERT settles (persist then re-reads on a failure),
// and one that landed after this read (`seq`) began. An entry with an edit or
// remove in flight (entriesInFlight, its write not failed) stays as `before`
// has it — the edited row, or absent — until that write settles: a re-read
// for another entry's failure must not put back its old value. Nor, once it
// has settled, may a read that began before it landed: such an entry
// (landedAt) is its saved row, or absent if removed.
function withPending(before, fresh, seq) {
  const held = (id) => entriesInFlight.has(id) && !entriesFailed.has(id);
  const landed = (id) => { const l = landedAt.get(id); return l && l.at >= seq ? l : null; };
  const page = new Map((before ?? []).map(row => [row.id, row]));
  // Held and not on the page, or landed as removed: left out.
  const kept = (r) => held(r.id) ? page.get(r.id) : landed(r.id) ? landed(r.id).row : r;
  const merged = fresh.map(kept).filter(Boolean);
  for (const row of before ?? []) {
    const keep = pendingInserts.has(row.id) ? row : landed(row.id)?.row;
    if (keep && !merged.some(r => r.id === keep.id)) merged.push(keep);
  }
  return merged;
}

async function loadAllProfileData() {
  if (!DB) {
    await Promise.all(members.map(m => loadProfileData(m.id)));
    return;
  }

  // A refusal is not "no health information on file for anyone" — a different
  // and dangerously reassuring statement. The hub answers these reads with the
  // rows the member may see (an adult: every card; a guest or a child: their
  // own card and, on the care team, the cards marked for it) and refuses them
  // outright (403) only when the member may not read the table at all. Any
  // other failure is rethrown for the caller to report.
  let pr, ar, mr, cr;
  const seq = ++readSeq;
  openReads.add(seq);
  try {
    try {
      [pr, ar, mr, cr] = await dbBatch([
        { sql: "SELECT * FROM app_health_cards__health_profiles ORDER BY created_at" },
        { sql: "SELECT * FROM app_health_cards__health_allergies ORDER BY profile_id, sort_order, created_at" },
        { sql: "SELECT * FROM app_health_cards__health_medications ORDER BY profile_id, created_at" },
        { sql: "SELECT * FROM app_health_cards__health_contacts ORDER BY profile_id, priority, created_at" },
      ]);
    } catch (e) {
      if (e.status !== 403) throw e;
      accessDenied = true;
      return;
    }
    profilesLoaded = true;

    const before = { allergies, medications, contacts };
    profiles = Object.fromEntries(members.map(m => [m.id, null]));
    allergies = {};
    medications = {};
    contacts = {};

    for (const profile of pr.rows ?? []) {
      if (isSafeId(profile.id) && isSafeId(profile.member_id)) profiles[profile.member_id] = profile;
    }
    for (const allergy of ar.rows ?? []) {
      if (isSafeId(allergy.id) && isSafeId(allergy.profile_id)) (allergies[allergy.profile_id] ??= []).push(allergy);
    }
    for (const medication of mr.rows ?? []) {
      if (isSafeId(medication.id) && isSafeId(medication.profile_id)) (medications[medication.profile_id] ??= []).push(medication);
    }
    for (const contact of cr.rows ?? []) {
      if (isSafeId(contact.id) && isSafeId(contact.profile_id)) (contacts[contact.profile_id] ??= []).push(contact);
    }
    for (const [kind, fresh] of [["allergies", allergies], ["medications", medications], ["contacts", contacts]]) {
      for (const [pid, list] of Object.entries(before[kind])) {
        const merged = withPending(list, fresh[pid] ?? [], seq);
        if (merged.length || fresh[pid]) fresh[pid] = merged;
      }
    }
  } finally {
    readDone(seq);
  }
}

// Single-flight per member: concurrent callers (an add while the care-team
// switch creates the card) share one INSERT or recovery and the same object.
const profileCreations = new Map(); // member_id → in-flight createProfile
function ensureProfile(memberId) {
  if (profiles[memberId]) return Promise.resolve(profiles[memberId]);
  let creating = profileCreations.get(memberId);
  if (!creating) {
    creating = createProfile(memberId).finally(() => profileCreations.delete(memberId));
    profileCreations.set(memberId, creating);
  }
  return creating;
}

async function createProfile(memberId) {
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();
  const member = members.find(m => m.id === memberId) ?? { id: memberId };
  const insert = profileInsert(id, member, now);
  try {
    await db(insert.sql, insert.params);
  } catch (e) {
    // The card may already be on the hub: another adult made it first (the
    // UNIQUE member_id), or this INSERT landed and its answer was lost. What
    // is stored decides — use it if there is one.
    const stored = await loadProfileData(memberId).then(() => profiles[memberId], () => null);
    if (stored) return stored;
    throw e;
  }
  // A re-read that landed meanwhile may already hold the stored card.
  profiles[memberId] ??= { id, member_id: memberId, notes: "", card_name: insert.cardName ?? "", visibility: VISIBILITY_ADULTS };
  const pid = profiles[memberId].id;
  allergies[pid]   ??= [];
  medications[pid] ??= [];
  contacts[pid]    ??= [];
  return profiles[memberId];
}

/**
 * Copies each member's current display name onto their profile's `card_name`,
 * the share page's title, wherever it differs. The hub renames members, not
 * this app, so this is how a rename reaches a shared card. Best-effort: a
 * failed write leaves the old name and is retried on the next load.
 */
async function refreshCardNames(only) {
  if (!DB || accessDenied || !IS_ADULT) return;
  // Only the cards this member may change (canEditCard): the rest would each
  // answer `changed: 0`. In a co-parenting space that leaves the other
  // parent's card to them (the hub bounds a steward's writes to their own and
  // a child's cards), so its title refreshes on their next load.
  const mine = members.filter(m => canEditCard(m.id) && (!only || m.id === only));
  const updates = cardNameUpdates(profiles, mine);
  // Batches of up to 25 cards (the hub's limit on statements per batch), so
  // the hub's per-request work (and, in a co-parenting space, its child-roster
  // read) is paid once per batch. A batch is all or nothing, so one the hub
  // REFUSES (400/403: some card it turns down) is retried a card at a time, one
  // after another, so that card never holds back the rest. A hub that is
  // failing or rate-limiting is not sent more: every old name stays until the
  // next load.
  for (let i = 0; i < updates.length; i += BATCH_LIMIT) {
    const chunk = updates.slice(i, i + BATCH_LIMIT);
    const statements = chunk.map(({ id, cardName }) => ({
      sql: "UPDATE app_health_cards__health_profiles SET card_name = ? WHERE id = ?", params: [cardName, id],
    }));
    const isRefusal = e => e?.status === 400 || e?.status === 403;
    let results;
    let hubFailing = false;
    try {
      results = await dbBatch(statements);
    } catch (e) {
      if (!isRefusal(e)) return;
      results = [];
      for (const { sql, params } of statements) {
        try {
          results.push(await db(sql, params));
        } catch (err) {
          results.push(null);
          // Stop on a failing or rate-limiting hub; the names written so far
          // still land below.
          if (!isRefusal(err)) { hubFailing = true; break; }
        }
      }
    }
    chunk.forEach(({ id, cardName }, j) => {
      if (!results[j] || wroteNothing(results[j])) return;
      const profile = Object.values(profiles).find(p => p?.id === id);
      if (profile) profile.card_name = cardName;
    });
    if (hubFailing) return;
  }
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  // Refused reads show the access-denied view even over an open card, so
  // nothing read before the refusal stays on screen (or printable).
  if (selectedMemberId && !accessDenied) renderDetail();
  else renderList();
}

function renderList() {
  if (accessDenied) {
    document.getElementById("app").innerHTML = `
      <div class="container">
        <div class="page-header">
          <h1>Health Cards</h1>
          <p class="subtitle">Allergy &amp; emergency information for your family</p>
        </div>
        <p class="empty-text">Health cards are kept to the adults in this household.</p>
      </div>`;
    return;
  }
  if (loadFailed) {
    document.getElementById("app").innerHTML = `
      <div class="container">
        <div class="page-header">
          <h1>Health Cards</h1>
          <p class="subtitle">Allergy &amp; emergency information for your family</p>
        </div>
        <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the health cards.</span> <button type="button" class="load-error-retry" data-testid="load-retry" onclick="retryLoad()">Try again</button></div>
      </div>`;
    return;
  }
  // A guest or a child is shown the cards the hub let them read, once it has
  // answered — their own, and the care team's — never a list of the household
  // with "No allergies on file" against every member they cannot read. The
  // hub's SELECT decides: every card it returned is listed, whatever the
  // page's copy of the care-team rule (groups, setting) says.
  if (!IS_ADULT && !profilesLoaded) {
    document.getElementById("app").innerHTML =
      `<div class="container"><p class="subtitle" style="margin-top:40px">Loading…</p></div>`;
    return;
  }
  const listed = IS_ADULT ? members : members.filter(m => !!profiles[m.id]);
  const cards = listed.map(m => {
    const profileLoaded = m.id in profiles;
    const pid = profiles[m.id]?.id;
    const al  = pid ? (allergies[pid] ?? []) : [];
    const hasSevere = hasSevereAllergy(al);
    const badge = !profileLoaded
      ? `<span class="allergy-badge badge-none">…</span>`
      : al.length > 0
        ? `<span class="allergy-badge ${hasSevere ? "badge-urgent" : "badge-normal"}">${allergyCountLabel(al.length)}</span>`
        : `<span class="allergy-badge badge-none">No allergies on file</span>`;
    const color = memberColor(m.id, members);
    return `
      <button class="member-card" onclick="selectMember('${esc(m.id)}')">
        <div class="member-avatar" style="background:${esc(color)}">${esc(initial(m.name))}</div>
        <div class="member-info">
          <div class="member-name">${esc(m.name)}</div>
          <div class="member-role">${esc(m.role)}</div>
        </div>
        ${IS_ADULT && isCareProfile(profiles[m.id]) ? `<span class="badge-care" data-testid="care-badge">Care team</span>` : ""}
        ${badge}
        <span class="chevron">›</span>
      </button>`;
  }).join("");

  // The care team group is the admin's to choose (the hub's admin-config
  // endpoint refuses anyone else), and the hub is where the setting lives.
  // Not offered while the groups or the setting are unread: the modal would
  // show "no groups" or "no care team" for what is only unknown.
  // A failed read of either is said to the admin, with a way to read it again.
  const careTeamBtn = !(IS_ADMIN && DB && ADMIN_CONFIG_URL) ? ""
    : careTeamKnown()
      ? `<div class="header-actions"><button class="btn-ghost" data-testid="care-team-settings" onclick="openCareTeamModal()">Care team${careTeamConfigured() ? `: ${esc(careTeamGroup().name)}` : ""}</button></div>`
      : careTeamChecked

// ── Care team controls ───────────────────────────────────────────────────────
// Whether a card is shared with the care team. Offered once an admin has
// chosen the group, on the viewer's own card and on a child's
// (canShareCard) — never on another adult's own card. That is the page's
// rule: the hub takes the column from any adult who sees the card
// (column_write_acls visibility: adult). A card with nothing on it yet is
// created first, as adding an entry would.
function careRowHtml(profile) {
  if (!canShareCard(selectedMemberId)) return "";
  if (careTeamConfigured()) {
    const on = isCareProfile(profile);
    return `
      <label class="care-row" data-testid="care-row">
        <input type="checkbox" data-testid="care-toggle" ${on ? "checked" : ""} ${careWriteInFlight ? "disabled" : ""} onchange="setCareTeamSharing(this.checked)" />
        <div>
          <div><strong>Share with the care team</strong> (${esc(careTeamGroup().name)})</div>
          <div class="care-hint">Its members read this card — the allergies, emergency medications and contacts — and change nothing. Each adult chooses this for their own card; the adults choose it for the children's.</div>
        </div>
      </label>`;
  }
  // A card still shared while no care team group is set (never chosen,
  // cleared, deleted, or unread): it can always be taken back, so the next
  // group picked does not inherit old shares unseen. Sharing a card anew
  // waits for a group.
  if (isCareProfile(profile)) {
    return `
      <div class="care-row" data-testid="care-row">
        <div>
          <div><strong>Shared with the care team</strong></div>
          <div class="care-hint">This card is still marked for the care team, so whichever group is chosen as the care team reads it. Stop sharing to keep it with the adults.</div>
        </div>
        <button class="btn-secondary" data-testid="care-unshare" ${careWriteInFlight ? "disabled" : ""} onclick="setCareTeamSharing(false)">Stop sharing</button>
      </div>`;
  }
  if (!careTeamKnown()) return "";
  const hint = IS_ADMIN
    ? `No care team yet. Choose a member group under <strong>Care team</strong> on the front page to share a card with a nanny or a grandparent who signs in.`
    : `A card can also be shared with a care team (a nanny, a grandparent who signs in) once an admin chooses that group under <strong>Care team</strong> on the front page.`;
  return `<div class="care-row" data-testid="care-hint"><div class="care-hint">${hint}</div></div>`;
}

window.setCareTeamSharing = async function(on) {
  if (!canShareCard(selectedMemberId) || careWriteInFlight) return;
  if (on && !careTeamConfigured()) return;
  const visibility = on ? VISIBILITY_CARE : VISIBILITY_ADULTS;
  const memberId = selectedMemberId;
  let profileId = null;
  careWriteInFlight = true;
  // A re-read during an await replaces the profile objects: set and roll back
  // the one on the page now, if it is still this card.
  const setVisibility = (value) => {
    const current = profiles[memberId];
    if (current?.id === profileId) current.visibility = value;
  };
  try {
    const profile = await ensureProfile(memberId);
    profileId = profile.id;
    const before = profile.visibility;
    setVisibility(visibility);
    render();
    let res;
    try {
      res = await db("UPDATE app_health_cards__health_profiles SET visibility = ? WHERE id = ?", [visibility, profileId]);
    } catch (e) {
      setVisibility(before);
      throw e;
    }
    if (wroteNothing(res)) {
      setVisibility(before);
      throw Object.assign(new Error("visibility update changed nothing"), { changedNothing: true });
    }
  } catch (e) {
    console.error(e);
    const reread = await loadAllProfileData().then(() => true, () => false);
    const stillThere = Object.values(profiles).some(p => p?.id === profileId);
    hubAlert(e?.changedNothing && reread
      ? stillThere ? "You don’t have permission to change who reads this card." : "This card has been removed."
      : failureLine(e, { action: "change who reads this card" }));
  } finally {
    careWriteInFlight = false;
    render();
  }
};

// Which hub member group is the care team. Saved through the hub's
// admin-config endpoint (manifest admin_config), which only an admin may call;
// the page offers the control to an admin alone. Members are put in the
// group in the hub's member settings. Medications keeps its own setting under
// the same key name; each app's choice is its own.

window.saveCareTeam = async function() {
  const value = document.getElementById("f-care-team-group")?.value ?? "";
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const res = await fetch(ADMIN_CONFIG_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: "care_team_group_id", value }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body || typeof body !== "object" || body.error) {
      throw Object.assign(new Error(body?.error || `Request failed (${res.status})`), { status: res.status });
    }
    // What is stored decides, not what was sent: a lost answer may have landed.
    await loadSettings().catch(() => { settings.care_team_group_id = value || null; settingsRead = true; });
    closeModal();
    render();
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    hubAlert(failureLine(e, { action: "choose the care team" }));
  }
};

window.submitAllergyForm = async function(allergyId) {
  const name = document.getElementById("f-al-name").value.trim();
  if (!name) { document.getElementById("f-al-name").focus(); return; }

  const severity = document.getElementById("f-al-severity").value;
  const triggers = document.getElementById("f-al-triggers").value.trim();
  const symptoms = document.getElementById("f-al-symptoms").value.trim();
  const steps    = document.getElementById("f-al-steps").value.trim();

  try {
    const profile = await ensureProfile(selectedMemberId);
    const pid = profile.id;
    const now = new Date().toISOString();

    if (allergyId) {
      const before = snapshotEntry("allergies", pid, allergyId);
      const idx = (allergies[pid] ?? []).findIndex(a => a.id === allergyId);
      if (idx >= 0) allergies[pid][idx] = { ...allergies[pid][idx], name, severity, triggers, symptoms, response_steps: steps };
      closeModal();
      render();
      persist(db(
        "UPDATE app_health_cards__health_allergies SET name = ?, severity = ?, triggers = ?, symptoms = ?, response_steps = ? WHERE id = ?",
        [name, severity, triggers, symptoms, steps, allergyId]
      ), allergyId, null, before);
    } else {
      const id         = crypto.randomUUID();
      pendingInserts.add(id);
      const before = snapshotEntry("allergies", pid, id);
      const sort_order = (allergies[pid] ?? []).length;
      if (!allergies[pid]) allergies[pid] = [];
      const row = { id, profile_id: pid, name, severity, triggers, symptoms, response_steps: steps, sort_order, created_at: now, created_by: WRITER };
      allergies[pid].push(row);
      closeModal();
      render();
      persist(db(
        "INSERT INTO app_health_cards__health_allergies (id, profile_id, name, severity, triggers, symptoms, response_steps, sort_order, created_at, created_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)",
        [id, pid, name, severity, triggers, symptoms, steps, sort_order, now, WRITER]
      ), null, { table: "app_health_cards__health_allergies", kind: "allergies", row }, before).finally(render);
    }
  } catch (e) {
    console.error(e);
    hubAlert(failureLine(e, { action: "save that change" }));
  }
};

window.deleteAllergy = async function(allergyId) {
  const pid0 = profiles[selectedMemberId]?.id;
  if (!canChangeEntry((allergies[pid0] ?? []).find(r => r.id === allergyId))) return;
  const ok = await hubConfirm({ message: "Remove this allergy?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  // Asked again: an edit on this entry may have started while the dialog was open.
  if (!canChangeEntry((allergies[profiles[selectedMemberId]?.id] ?? []).find(r => r.id === allergyId))) return;
  const pid = profiles[selectedMemberId]?.id;
  const before = pid ? snapshotEntry("allergies", pid, allergyId) : null;
  if (pid) allergies[pid] = (allergies[pid] ?? []).filter(a => a.id !== allergyId);
  render();
  persist(db("DELETE FROM app_health_cards__health_allergies WHERE id = ?", [allergyId]), allergyId, null, before);
};

};

// ── Contact CRUD ─────────────────────────────────────────────────────────────
window.openContactModal = function(contactId) {
  if (!canEditCard(selectedMemberId)) return;
  const pid = profiles[selectedMemberId]?.id;
  const ex  = contactId ? (contacts[pid] ?? []).find(c => c.id === contactId) : null;
  if (contactId && !canChangeEntry(ex)) return;
  openModal(`
    <h2>${ex ? "Edit Contact" : "Add Emergency Contact"}</h2>
    <div class="form-field">
      <label>Name <span class="required">*</span></label>
      <input id="f-ct-name" type="text" value="${ex ? esc(ex.name) : ""}" placeholder="e.g. Sarah Mayer" />
    </div>
    <div class="form-field">
      <label>Relationship</label>
      <input id="f-ct-rel" type="text" value="${ex ? esc(ex.relationship) : ""}" placeholder="e.g. Mom, Dad, Pediatrician" />
    </div>
    <div class="form-field">
      <label>Phone number <span class="required">*</span></label>
      <input id="f-ct-phone" type="tel" value="${ex ? esc(ex.phone) : ""}" placeholder="e.g. 555-123-4567" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitContactForm('${contactId ?? ""}')">${ex ? "Save" : "Add Contact"}</button>
    </div>`);
  document.getElementById("f-ct-name").focus();
};

window.submitContactForm = async function(contactId) {
  const name  = document.getElementById("f-ct-name").value.trim();
  const phone = document.getElementById("f-ct-phone").value.trim();
  if (!name)  { document.getElementById("f-ct-name").focus();  return; }
  if (!phone) { document.getElementById("f-ct-phone").focus(); return; }

  const rel = document.getElementById("f-ct-rel").value.trim();

  try {
    const profile = await ensureProfile(selectedMemberId);
    const pid = profile.id;
    const now = new Date().toISOString();

    if (contactId) {
      const before = snapshotEntry("contacts", pid, contactId);
      const idx = (contacts[pid] ?? []).findIndex(c => c.id === contactId);
      if (idx >= 0) contacts[pid][idx] = { ...contacts[pid][idx], name, relationship: rel, phone };
      closeModal();
      render();
      persist(db(
        "UPDATE app_health_cards__health_contacts SET name = ?, relationship = ?, phone = ? WHERE id = ?",
        [name, rel, phone, contactId]
      ), contactId, null, before);
    } else {
      const id       = crypto.randomUUID();
      pendingInserts.add(id);
      const before = snapshotEntry("contacts", pid, id);
      const priority = (contacts[pid] ?? []).length + 1;
      if (!contacts[pid]) contacts[pid] = [];
      const row = { id, profile_id: pid, name, relationship: rel, phone, priority, created_at: now, created_by: WRITER };
      contacts[pid].push(row);
      closeModal();
      render();
      persist(db(
        "INSERT INTO app_health_cards__health_contacts (id, profile_id, name, relationship, phone, priority, created_at, created_by) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
        [id, pid, name, rel, phone, priority, now, WRITER]
      ), null, { table: "app_health_cards__health_contacts", kind: "contacts", row }, before).finally(render);
    }
  } catch (e) {
    console.error(e);
    hubAlert(failureLine(e, { action: "save that change" }));
  }
};

window.deleteContact = async function(contactId) {
  const pid0 = profiles[selectedMemberId]?.id;
  if (!canChangeEntry((contacts[pid0] ?? []).find(r => r.id === contactId))) return;
  const ok = await hubConfirm({ message: "Remove this contact?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  // Asked again: an edit on this entry may have started while the dialog was open.
  if (!canChangeEntry((contacts[profiles[selectedMemberId]?.id] ?? []).find(r => r.id === contactId))) return;
  const pid = profiles[selectedMemberId]?.id;
  const before = pid ? snapshotEntry("contacts", pid, contactId) : null;
  if (pid) contacts[pid] = (contacts[pid] ?? []).filter(c => c.id !== contactId);
  render();
  persist(db("DELETE FROM app_health_cards__health_contacts WHERE id = ?", [contactId]), contactId, null, before);
};

// ── Print card ───────────────────────────────────────────────────────────────
// Printed from this document (see print.js and the `.print-root` rules above):
// the app frame has no popups, so there is no second window to write into.
window.printCard = function() {
  const member = members.find(m => m.id === selectedMemberId);
  if (!member || accessDenied) return;

  const pid = profiles[selectedMemberId]?.id;
  // A change still saving would print unconfirmed (an edit) or leave stored
  // information off (a remove): the card waits until every write settles.
  if (!printReady(writesInFlight, pid, careWriteInFlight)) {
    hubAlert("Wait for your changes to save, then print.");
    return;
  }
  const printDate = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  const markup = printCardMarkup({
    member,
    // Only what the hub has confirmed: an add still in flight stays off paper.
    allergies:   pid ? confirmedEntries(allergies[pid], pendingInserts)   : [],
    medications: pid ? confirmedEntries(medications[pid], pendingInserts) : [],
    contacts:    pid ? confirmedEntries(contacts[pid], pendingInserts)    : [],
    printDate,
  }, { esc, glyph });

  printInPlace(window, markup, { title: `Health Card — ${member.name ?? ""}` });
};

// ── Init ─────────────────────────────────────────────────────────────────────
async function firstLoad() {
  try {
    await loadMembers();
    render();
    // The setting only labels the page (who the care team is): its failure
    // leaves that unknown and the cards still load.
    const settingsLoad = loadSettings().catch(e => console.error("care team setting unread", e));
    await loadAllProfileData();
    await settingsLoad;
    careTeamChecked = true;
    loadFailed = false;
  } catch (e) {
    console.error(e);
    loadFailed = true;
    render();
    return;
  }
  render();
  await refreshCardNames();
}
window.retryLoad = firstLoad;
firstLoad();
</script>
